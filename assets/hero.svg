  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#56d364">0<tspan font-size="15" font-weight="400" fill="#8b949e" dx="8">of 77</tspan></text>
