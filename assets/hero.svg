<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Cloakroom, a privacy layer for Claude Code. v0.2, each set run once: 0 of 77 real-format keys leaked, 0.95 recall on real court rulings, 0.66 precision on real credentials (false alarms are the weak spot).">
