<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Cloakroom, a privacy layer for Claude Code. Your customers' names and your API keys never reach the model. Claude still gets the job done. No account, no cloud. Learns from your corrections. Mac, Windows and Linux. Free and open source.">
  <title>Cloakroom: a privacy layer for Claude Code</title>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#d2a8ff" stroke-opacity="0.05"/></pattern>
    <radialGradient id="glow" cx="50%" cy="15%" r="70%"><stop offset="0%" stop-color="#56d364" stop-opacity="0.13"/><stop offset="100%" stop-color="#56d364" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="880" height="400" rx="12" fill="#0d1117"/>
  <rect width="880" height="400" rx="12" fill="url(#grid)"/>
  <rect width="880" height="230" rx="12" fill="url(#glow)"/>
  <g transform="translate(296 44)" fill="none" stroke="#56d364" stroke-width="2.6" stroke-linejoin="round">
    <path d="M4 6 H40 V16 A6 6 0 0 0 40 28 V38 H4 V28 A6 6 0 0 0 4 16 Z"/>
    <path d="M14 22 H30" stroke-dasharray="3 3"/>
  </g>
  <text x="356" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" fill="#ffffff">Cloakroom</text>
  <text x="440" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">A privacy layer for Claude Code</text>
  <text x="440" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.4" fill="#ffffff" text-anchor="middle">Your customers' names and your API keys</text>
  <text x="440" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.4" fill="#ffffff" text-anchor="middle">never reach the model.</text>
  <text x="440" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#56d364" text-anchor="middle">Claude still gets the job done.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">
    <rect x="76" y="318" width="196" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="174" y="340">No account, no cloud</text>
    <rect x="292" y="318" width="250" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="417" y="340">Learns from your corrections</text>
    <rect x="562" y="318" width="242" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="683" y="340">Mac · Windows · Linux</text>
  </g>
  <text x="440" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Free and open source · Apache-2.0</text>
</svg>
