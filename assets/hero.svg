  <text x="60" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.6" fill="#8b949e">V0.2 · EACH SET RUN ONCE, BEFORE ANY TUNING ON IT</text>
