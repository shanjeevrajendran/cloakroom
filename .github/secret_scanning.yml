# Every "secret" in these paths is synthetic test data generated for the benchmark and tests (random characters
# in real key formats, so detectors are exercised). Excluded from secret-scanning alerts and push protection.
# Real code (src/, plugin/, scripts/) stays scanned.
paths-ignore:
  - "bench/*.jsonl"
  - "bench/*_onnx_parity.json"
  - "bench/*_results.json"
  - "bench/rerun-*/*.json"
  - "bench/gen_corpus.py"
  - "bench/gen_holdout.py"
  - "bench/gen_holdout_v7.py"
  - "bench/live_test.sh"
  - "demo/record.sh"
  - "tests/**"
