name: release
# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. Uses PyPI trusted publishing (OIDC): no API token
# is stored anywhere. One-time setup on pypi.org: add this repo + workflow "release.yml" + environment "pypi" as a
# trusted publisher for the project "cloakroom".
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version v$v"; exit 1; }
      - run: pip install build twine pytest && pip install -e .
      - run: pytest -q tests
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
