name: release
# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. Uses PyPI trusted publishing (OIDC): no API token
# is stored anywhere. One-time setup on pypi.org: add this repo + workflow "release.yml" + environment "pypi" as a
# trusted publisher for the project "cloakroom".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # dry run on a branch: build + smoke run, publish and github-release are skipped (they need a v* tag)

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: tag matches the package version
        id: ver
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "${GITHUB_REF}" in refs/tags/v*) test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version v$v"; exit 1; };; esac
      - run: pip install build twine pytest && pip install -e .
      - run: pytest -q tests
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  # The built wheel must install and run on all three systems before anything is published.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - name: install the wheel into a fresh venv (no extras)
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          bin="$RUNNER_TEMP/smoke/bin"; [ -d "$bin" ] || bin="$RUNNER_TEMP/smoke/Scripts"
          echo "SMOKE_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/python" -m pip install dist/*.whl
      - name: cloakroom --version equals the release version
        run: |
          out=$("$SMOKE_BIN/cloakroom" --version); echo "$out"
          test "$out" = "cloakroom ${{ needs.build.outputs.version }}"
      - name: cloakroom doctor (rules only) exits 0
        env:
          CLOAKROOM_MODE: rules
          CLOAKROOM_HOME: ${{ runner.temp }}/cloakroom-home
        run: |
          export CLOAKROOM_VAULT_KEY=$(python -c "import os;print(os.urandom(32).hex())")  # no OS key-store prompt on a headless runner
          $SMOKE_BIN/cloakroom doctor
      - name: plugin bootstrap.sh parses and its --check passes
        env:
          CLOAKROOM_HOME: ${{ runner.temp }}/cloakroom-home
        run: |
          bash -n plugin/scripts/bootstrap.sh
          bash plugin/scripts/bootstrap.sh --check
      - name: plugin bootstrap.ps1 parses and its -Check passes
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CLOAKROOM_HOME: ${{ runner.temp }}\cloakroom-home
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\plugin\scripts\bootstrap.ps1", [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File plugin\scripts\bootstrap.ps1 -Check
          exit $LASTEXITCODE

  publish:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release page for the tag
    steps:
      - run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Cloakroom $GITHUB_REF_NAME" \
            --notes "Install with uv tool install \"cloakroom[model,torch]\" (see the README). PyPI: https://pypi.org/project/cloakroom/"
        env:
          GH_TOKEN: ${{ github.token }}

